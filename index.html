<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Prompt Generator</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

  <style>
    :root {
      color-scheme: dark;
      --bg: #111318;
      --panel: #191d24;
      --panel2: #222833;
      --text: #f4f7fb;
      --muted: #aeb7c6;
      --accent: #7dd3fc;
      --border: #2e3745;
      --ok: #86efac;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(ellipse at 50% 0%, #1b2939 0%, transparent 65%), var(--bg);
      min-height: 100vh;
      color: var(--text);
      line-height: 1.5;
    }

    .wrap {
      width: min(1140px, calc(100% - 64px));
      margin: 56px auto;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 5vw, 44px);
      line-height: 1.15;
      letter-spacing: -0.035em;
    }

    .sub {
      color: var(--muted);
      margin: 12px 0 32px;
      max-width: 640px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      min-width: 0;
    }

    .grid .card {
      min-height: 180px;
    }

    .output {
      padding: 28px;
      box-shadow: 0 16px 48px #00000020;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    select,
    input {
      width: 100%;
      background: var(--panel2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 12px;
      font: inherit;
      min-height: 46px;
    }

    select {
      text-transform: capitalize;
    }

    :is(select, input, textarea, button):focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }

    .chords {
      margin-top: 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
    }

    .title-section {
      padding-bottom: 24px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }

    .title-row {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    #song-title {
      flex: 1;
      min-width: 0;
      height: 46px;
      min-height: 46px;
      padding: 4px 0;
      resize: none;
      background: transparent;
      border: 0;
      border-radius: 4px;
      font-size: clamp(18px, 2.2vw, 25px);
      font-family: inherit;
      line-height: 1.5;
      font-weight: 600;
      letter-spacing: -0.025em;
      color: var(--accent);
    }

    #copy-title {
      flex-shrink: 0;
    }

    textarea {
      width: 100%;
      display: block;
      min-height: 290px;
      resize: vertical;
      background: #0d1015;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      font: 14px/1.8 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    button {
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 11px 16px;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      min-height: 44px;
      cursor: pointer;
      background: var(--accent);
      color: #062231;
      transition: background 150ms ease, border-color 150ms ease;
    }

    button:hover {
      background: #a5e2fd;
    }

    button.secondary {
      background: var(--panel2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    button.secondary:hover {
      background: #2b3544;
      border-color: #53647a;
    }

    #status {
      color: var(--ok);
      font-weight: 700;
      align-self: center;
      min-height: 1.5em;
      font-size: 13px;
      margin-left: auto;
    }

    .note {
      color: var(--muted);
      font-size: 12px;
      margin-top: 14px;
      line-height: 1.6;
    }

    @media (max-width: 960px) {
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 600px) {
      .wrap {
        width: calc(100% - 32px);
        margin: 32px auto;
      }

      .grid {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .grid .card {
        min-height: 0;
      }

      .output {
        padding: 20px;
      }

      .title-row {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
      }

      #song-title {
        font-size: 18px;
        flex: none;
        height: 64px;
      }

      textarea {
        min-height: 380px;
        padding: 16px;
      }

      #status {
        flex-basis: 100%;
        margin-left: 0;
      }
    }
  </style>
</head>

<body>
  <main class="wrap">

    <p class="eyebrow">Atmospheric rock · Made for guitar</p>

    <h1>Prompt Generator</h1>

    <p class="sub">
      Choose a key, mood, and intensity. The app builds a guitar-friendly
      atmospheric rock prompt automatically.
    </p>

    <section class="grid" aria-label="Song settings">

      <div class="card">
        <label for="key">Key</label>
        <select id="key"></select>

        <div class="chords" id="chords"></div>
      </div>

      <div class="card">
        <label for="tempo">Tempo</label>

        <input
          id="tempo"
          type="number"
          min="40"
          max="140"
          value="68"
        />

        <div class="note">
          Double-time feel is calculated automatically.
        </div>
      </div>

      <div class="card">
        <label for="mood">Mood</label>

        <select id="mood">
          <option>uplifting</option>
          <option>melancholic</option>
          <option>hopeful</option>
          <option>dreamy</option>
          <option>moody</option>
          <option>anthemic</option>
        </select>
        <div class="note">Set the emotional direction.</div>
      </div>

      <div class="card">
        <label for="intensity">Mood intensity</label>

        <select id="intensity">
          <option value="subtle">Subtle</option>
          <option value="emotional" selected>Emotional</option>
          <option value="soaring">Soaring</option>
        </select>
        <div class="note">Shape the size of the build.</div>
      </div>

    </section>

    <section class="card output" aria-label="Generated song details">

      <div class="title-section">
        <label for="song-title">Song title</label>
        <div class="title-row">
          <textarea id="song-title" rows="2" readonly></textarea>
          <button class="secondary" id="copy-title">Copy title</button>
        </div>
      </div>

      <label for="prompt">Generated prompt</label>

      <textarea id="prompt"></textarea>

      <div class="actions">

        <button id="copy">
          Copy prompt
        </button>

        <button class="secondary" id="reset">
          Reset
        </button>

        <span id="status" role="status" aria-live="polite"></span>

      </div>

    </section>

  </main>

  <script>
    const keys = {
      "G major": {
        chords: ["G", "C", "D", "Em", "Am"],
        note: "open-position friendly"
      },

      "D major": {
        chords: ["D", "G", "A", "Bm", "Em"],
        note: "very guitar-friendly"
      },

      "A major": {
        chords: ["A", "D", "E", "F#m", "Bm"],
        note: "mostly open-position friendly"
      },

      "E major": {
        chords: ["E", "A", "B", "C#m", "F#m"],
        note: "strong open-string resonance"
      },

      "C major": {
        chords: ["C", "F", "G", "Am", "Dm"],
        note: "simple, with F often played as Fmaj7 or partial barre"
      },

      "F major": {
        chords: ["F", "Bb", "C", "Dm", "Gm"],
        note: "better as capo-friendly voicings"
      },

      "Bb major": {
        chords: ["Bb", "Eb", "F", "Gm", "Cm"],
        note: "best treated as capo-friendly"
      },

      "Eb major": {
        chords: ["Eb", "Ab", "Bb", "Cm", "Fm"],
        note: "best treated as capo-friendly"
      }
    };


    const intensityDescriptions = {

      subtle:
        "gentle dynamics and no oversized climax",

      emotional:
        "warm expression and a gradual emotional lift",

      soaring:
        "a wide, powerful climax that stays spacious"

    };


    const keyEl =
      document.getElementById("key");

    const chordsEl =
      document.getElementById("chords");

    const tempoEl =
      document.getElementById("tempo");

    const moodEl =
      document.getElementById("mood");

    const intensityEl =
      document.getElementById("intensity");

    const promptEl =
      document.getElementById("prompt");

    const titleEl =
      document.getElementById("song-title");

    const statusEl =
      document.getElementById("status");


    Object.keys(keys).forEach(key => {

      const option =
        document.createElement("option");

      option.value = key;
      option.textContent = key;

      keyEl.appendChild(option);

    });


    keyEl.value = "G major";


    function generatePrompt() {

      const key =
        keyEl.value;

      const { chords, note } =
        keys[key];

      const bpm =
        Number(tempoEl.value) || 68;

      const doubleTime =
        bpm * 2;

      const mood =
        moodEl.value;

      const intensity =
        intensityEl.value;

      const intensityText =
        intensityDescriptions[intensity];

      const titleCase = text =>
        text.replace(/\b[a-z]/g, letter => letter.toUpperCase());

      titleEl.value =
        `${titleCase(mood)} ${titleCase(intensity)} in ${titleCase(key)}`;


      chordsEl.textContent =
        chords.join(" · ");


      const capoPhrase =
        note.includes("capo")
          ? "Capo-friendly open guitar chords"
          : "Playable open guitar chords";


      promptEl.value =
`Instrumental melodic atmospheric rock backing track, 4/4 at ${bpm} BPM, ${doubleTime} BPM double-time feel. ${capoPhrase} in ${key}: ${chords.join(", ")}. Hold chords; keep harmony simple. Soft, humanized closed hats or shaker: quiet 16ths with alternating 8th-note accents. Strong snare on 2 and 4; deep, sparse kick anchors 1, supports 3, with sparse chord-change pickups. Predictable drums; no busy fills, ghost-note clutter, trap rolls or abrupt changes. Brief tom fills/crashes only at 8/16-bar transitions. Warm, rounded clean electric bass: sustain low chord roots for half/full bars. Align main attacks with downbeat kicks; sustain through other hits. Occasional fifths, octaves or stepwise pickups; no slap, funk, busy runs or melodic fills. Spacious intro; bass and full drums enter gradually. Build toward ${mood} rock with ${intensityText}. Clear 4/8-bar phrasing, steady harmony, uncluttered midrange and room for expressive lead guitar.`;

    }


    [
      keyEl,
      tempoEl,
      moodEl,
      intensityEl

    ].forEach(element => {

      element.addEventListener(
        "input",
        generatePrompt
      );

    });


    document
      .getElementById("copy")
      .addEventListener("click", async () => {

        try {

          await navigator.clipboard.writeText(
            promptEl.value
          );

          statusEl.textContent =
            "Copied!";

          setTimeout(() => {
            statusEl.textContent = "";
          }, 1400);

        }

        catch {

          promptEl.select();

          document.execCommand("copy");

          statusEl.textContent =
            "Copied!";

          setTimeout(() => {
            statusEl.textContent = "";
          }, 1400);

        }

      });


    document
      .getElementById("copy-title")
      .addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(titleEl.value);
          statusEl.textContent = "Title copied!";
        }
        catch {
          titleEl.select();
          const copied = document.execCommand("copy");
          statusEl.textContent = copied
            ? "Title copied!"
            : "Select the title and copy it manually.";
        }

        setTimeout(() => {
          statusEl.textContent = "";
        }, 2400);
      });


    document
      .getElementById("reset")
      .addEventListener("click", () => {

        keyEl.value =
          "G major";

        tempoEl.value =
          68;

        moodEl.value =
          "uplifting";

        intensityEl.value =
          "emotional";

        generatePrompt();

      });


    generatePrompt();

  </script>

</body>
</html>
